<section class="p-5">
  <h2 class="text-3xl font-bold text-heading">Projects</h2>

  <div>
    <form class="max-w-md mt-3">
      <label for="search" class="block mb-2.5 text-sm font-medium text-heading sr-only">
        Search
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 inset-s-0 flex items-center ps-3 pointer-events-none">
          <svg
            class="w-4 h-4 text-body"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-width="2"
              d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
            />
          </svg>
        </div>
        <input
          type="search"
          id="search"
          class="block w-full p-3 ps-9 bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body"
          placeholder="Search"
          required
        />
        <button
          type="button"
          class="absolute inset-e-2.5 bottom-1.5 cursor-pointer text-white bg-brand hover:bg-brand-strong box-border border border-transparent focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded text-xs px-3 py-1.5 focus:outline-none"
        >
          Search
        </button>
      </div>
    </form>
  </div>

  <div class="grid mt-3 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
    @for (project of projects_list(); track $index) {
      <div
        class="bg-white border border-default-medium rounded-md p-4 transition-shadow hover:shadow-md"
      >
        <div class="flex justify-between items-start gap-2">
          <div class="min-w-0">
            <h3 class="text-base font-semibold text-heading truncate">
              {{ project.name }}
            </h3>
            <p class="text-sm text-body mt-1 line-clamp-2">
              {{ project.description }}
            </p>
          </div>

          <div class="relative shrink-0">
            <button
              type="button"
              [id]="'project-menu-btn-' + $index"
              [attr.data-dropdown-toggle]="'project-menu-' + $index"
              class="p-1.5 rounded-base text-body hover:bg-neutral-secondary-medium focus:outline-none focus:ring-2 focus:ring-brand-medium"
            >
              <i class="fa-solid fa-ellipsis-vertical"></i>
              <span class="sr-only">Project options</span>
            </button>

            <div
              [id]="'project-menu-' + $index"
              class="hidden z-10 bg-white border border-default-medium divide-y divide-default-medium rounded-base shadow-xs w-32"
            >
              <ul class="py-1 text-sm text-heading">
                <li>
                  <button
                    type="button"
                    class="w-full text-start px-4 py-2 hover:bg-neutral-secondary-medium"
                  >
                    Update
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="w-full text-start px-4 py-2 text-red-600 hover:bg-neutral-secondary-medium"
                  >
                    Delete
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div class="mt-4">
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-xs font-medium text-body">Progress</span>
            <span class="text-xs font-medium text-heading">{{ project.progress }}%</span>
          </div>
          <div class="bg-neutral-secondary-medium h-2 rounded-full overflow-hidden">
            <div
              [style.width]="project.progress + '%'"
              class="bg-brand h-full rounded-full transition-all"
            ></div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
